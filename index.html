<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Note</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Note">
  <meta name="theme-color" content="#111213">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #14120f;
      --surface: #1d1a16;
      --surface2: #27231d;
      --border: #332e26;
      --text: #f0ebe3;
      --dim: #9a9285;
      --accent: #f2b84b;
      --accent-ink: #1a1408;
      --error: #f2685b;
      --r: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; }
    button { font: inherit; color: inherit; }

    .screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
    .screen.active { display: flex; }

    /* ── LIST ─────────────────────────────────── */
    .top { padding: calc(14px + env(safe-area-inset-top)) 18px 6px; }
    .top-row { display: flex; align-items: center; justify-content: space-between; }
    .big-title { font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
      font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
    .top-actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: none; border: none; color: var(--dim); width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; }
    .icon-btn:active { background: var(--surface2); }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
    .dot.ok { background: #6cc070; } .dot.busy { background: var(--accent); } .dot.err { background: var(--error); }
    .search { margin-top: 10px; width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 16px; padding: 11px 14px; outline: none; -webkit-appearance: none; }
    .search:focus { border-color: var(--accent); }
    .search::placeholder { color: var(--dim); }

    #list { flex: 1; overflow-y: auto; padding: 8px 18px calc(110px + env(safe-area-inset-bottom)); }
    .section { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim); margin: 16px 2px 8px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
    .card:active { background: var(--surface2); }
    .card.pinned { border-left: 3px solid var(--accent); }
    .card-title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-prev { color: var(--dim); font-size: 14px; line-height: 1.4; margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
    .card-time { color: var(--dim); font-size: 12px; margin-top: 8px; opacity: .8; }
    .empty { text-align: center; color: var(--dim); margin-top: 90px; line-height: 1.6; }
    .empty b { display: block; font-size: 18px; color: var(--text); margin-bottom: 4px; }

    #fab { position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom));
      width: 60px; height: 60px; border-radius: 20px; border: none; background: var(--accent); color: var(--accent-ink);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,.45); cursor: pointer; }
    #fab:active { transform: scale(.94); }
    #fab svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

    /* ── EDITOR ───────────────────────────────── */
    #editor-screen { background: var(--bg); }
    .ed-bar { display: flex; align-items: center; justify-content: space-between;
      padding: calc(8px + env(safe-area-inset-top)) 10px 8px; border-bottom: 1px solid var(--border); }
    .back { display: flex; align-items: center; gap: 2px; background: none; border: none; color: var(--accent);
      font-size: 17px; font-weight: 600; padding: 8px 8px; cursor: pointer; }
    .back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .ed-actions { display: flex; }
    .icon-btn.on { color: var(--accent); }
    .icon-btn.danger { color: var(--error); }
    #ed-text { flex: 1; width: 100%; overflow-y: auto; outline: none; color: var(--text); position: relative;
      font-size: 17px; line-height: 1.55; padding: 16px 18px calc(24px + env(safe-area-inset-bottom)); word-wrap: break-word;
      -webkit-user-select: text; user-select: text; }
    #ed-text { text-align: left; }
    /* placeholder rides on the first line (not absolutely positioned, which iOS Safari places oddly) */
    #ed-text.blank > :first-child::before { content: 'Start typing…'; color: var(--dim); float: left; height: 0; pointer-events: none; }
    #ed-text h1, #ed-text h2, #ed-text h3 { line-height: 1.25; margin: 10px 0 4px; font-family: ui-rounded, -apple-system, sans-serif; }
    #ed-text h1 { font-size: 26px; } #ed-text h2 { font-size: 21px; } #ed-text h3 { font-size: 18px; }
    #ed-text ul, #ed-text ol { margin: 2px 0; padding-left: 24px; }
    #ed-text li[data-chk] { list-style: none; position: relative; margin-left: -24px; padding-left: 34px; }
    #ed-text li[data-chk]::before { content: ''; position: absolute; left: 2px; top: .3em; width: 18px; height: 18px;
      border: 2px solid var(--dim); border-radius: 6px; box-sizing: border-box; }
    #ed-text li[data-chk="1"]::before { content: '✓'; background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
      font-size: 13px; font-weight: 900; line-height: 14px; text-align: center; }
    #ed-text li[data-chk="1"] { color: var(--dim); text-decoration: line-through; }
    #ed-text blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--dim); margin: 4px 0; }
    #ed-text code { background: var(--surface2); border-radius: 6px; padding: 1px 5px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
    #ed-text pre { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 6px 0; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
    #ed-text a { color: var(--accent); }
    .fmt { display: flex; gap: 2px; overflow-x: auto; padding: 4px 8px; border-top: 1px solid var(--border);
      scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .fmt { padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
    #editor-screen.kb .fmt { padding-bottom: 4px; }
    .fmt::-webkit-scrollbar { display: none; }
    :root { --fb: 48px; --ff: 19px; }
    .fmt button { flex: none; min-width: calc(var(--fb) + 4px); height: var(--fb); padding: 0 8px; background: none; border: none; border-radius: 12px;
      color: var(--dim); font-size: var(--ff); font-weight: 700; cursor: pointer; }
    .fmt button:active { background: var(--surface2); color: var(--text); }
    .fmt button.on { background: var(--accent); color: var(--accent-ink); }
    .seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; background: none; border: none; border-radius: 9px; color: var(--dim); font-size: 15px; font-weight: 600; padding: 10px 0; cursor: pointer; }
    .seg button.on { background: var(--accent); color: var(--accent-ink); }
    .fmt .sep { flex: none; width: 1px; margin: 8px 4px; background: var(--border); }
    .ed-tools { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-top: 1px solid var(--border); }
    .toast-undo { color: var(--accent); font-weight: 700; margin-left: 12px; cursor: pointer; pointer-events: auto; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--dim);
      font-size: 14px; font-weight: 600; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .chip .n { opacity: .6; font-weight: 500; margin-left: 4px; }
    .chip.ghost { background: none; border-style: dashed; }
    .chip.danger { color: var(--error); }
    .card-folder { float: right; font-size: 12px; font-weight: 600; color: var(--dim); background: var(--surface2);
      border-radius: 999px; padding: 2px 9px; margin-left: 8px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-end; z-index: 60; }
    .sheet.show { display: flex; }
    .sheet-card { width: 100%; max-height: 70dvh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0;
      padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); }
    .sheet-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 4px 6px 10px; }
    .sheet-row { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none;
      border-radius: 12px; padding: 14px 12px; font-size: 17px; text-align: left; cursor: pointer; color: var(--text); }
    .sheet-row:active { background: var(--surface2); }
    .sheet-row .tick { color: var(--accent); font-weight: 800; }
    .sheet-row.new { color: var(--accent); font-weight: 600; }
    .ed-meta { padding: 6px 18px; font-size: 12px; color: var(--dim); }

    /* ── SETTINGS ─────────────────────────────── */
    #settings-screen { padding: calc(28px + env(safe-area-inset-top)) 20px 40px; overflow-y: auto; gap: 18px; }
    .set-title { font-family: ui-rounded, -apple-system, sans-serif; font-size: 28px; font-weight: 800; }
    .set-sub { color: var(--dim); font-size: 14px; margin-top: -10px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .field input { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
      font-size: 16px; padding: 12px 14px; outline: none; width: 100%; -webkit-appearance: none; }
    .field input:focus { border-color: var(--accent); }
    .btn { background: var(--accent); border: none; border-radius: 14px; color: var(--accent-ink);
      font-size: 16px; font-weight: 700; padding: 14px; cursor: pointer; width: 100%; }
    .btn.ghost { background: var(--surface2); color: var(--text); }
    .btn:active { opacity: .75; }
    details.adv { border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; }
    details.adv summary { padding: 12px 0; font-size: 13px; color: var(--dim); cursor: pointer; }
    details.adv .field { padding-bottom: 14px; }

    #toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 18px;
      border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50; }
    #toast.show { pointer-events: auto; opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="toast"></div>
<div id="sheet" class="sheet" onclick="if (event.target === this) closeSheet()"><div class="sheet-card" id="sheet-card"></div></div>

<!-- ── LIST ─────────────────────────────────────── -->
<div id="list-screen" class="screen">
  <div class="top">
    <div class="top-row">
      <div class="big-title">Notes</div>
      <div class="top-actions">
        <button class="icon-btn" onclick="syncNow(true)" title="Sync" aria-label="Sync" style="width:auto;padding:0 8px;border-radius:20px">
          <span class="dot" id="dot"></span>
        </button>
        <button class="icon-btn" onclick="openSettings()" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <input class="search" id="search" type="search" placeholder="Search notes" autocomplete="off" oninput="renderList()">
    <div class="chips" id="chips"></div>
  </div>
  <div id="list"></div>
  <button id="fab" onclick="newNote()" aria-label="New note"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<!-- ── EDITOR ───────────────────────────────────── -->
<div id="editor-screen" class="screen">
  <div class="ed-bar">
    <button class="back" onclick="closeEditor()">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Notes
    </button>
    <div class="ed-actions">
      <button class="icon-btn" id="folder-btn" onclick="openMoveSheet()" title="Move to folder" aria-label="Move to folder">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="icon-btn" id="fmt-toggle" onclick="setFmtBar()" title="Formatting toolbar" aria-label="Formatting toolbar">
        <span style="font-weight:800;font-size:15px;letter-spacing:-.02em">Aa</span>
      </button>
      <button class="icon-btn" id="pin-btn" onclick="togglePin()" title="Pin" aria-label="Pin">
        <svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 3 3v2H7v-2l3-3z"/></svg>
      </button>
      <button class="icon-btn danger" onclick="deleteCurrent()" title="Delete" aria-label="Delete">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>
      </button>
    </div>
  </div>
  <div id="ed-text" class="blank" contenteditable="true" data-placeholder="Start typing…" oninput="onEdit()" onblur="flushEdit()" onkeydown="onKey(event)"></div>
  <div class="ed-tools"><div class="ed-meta" id="ed-meta" style="flex:1;text-align:right"></div></div>
  <div class="fmt" id="fmt" onmousedown="event.preventDefault()" ontouchstart="">
    <button data-f="bold" onclick="fmtCmd('bold')" aria-label="Bold"><b>B</b></button>
    <button data-f="italic" onclick="fmtCmd('italic')" aria-label="Italic"><i style="font-family:serif">I</i></button>
    <button data-f="strike" onclick="fmtCmd('strikeThrough')" aria-label="Strikethrough"><s>S</s></button>
    <span class="sep"></span>
    <button data-f="h" onclick="fmtHeading()" aria-label="Heading">H</button>
    <button data-f="ul" onclick="fmtList('insertUnorderedList')" aria-label="Bullet list">•</button>
    <button data-f="ol" onclick="fmtList('insertOrderedList')" aria-label="Numbered list">1.</button>
    <button data-f="chk" onclick="fmtCheck()" aria-label="Checklist"><svg viewBox="0 0 24 24" width="1.15em" height="1.15em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12l3 3 5-6"/></svg></button>
    <span class="sep"></span>
    <button data-f="quote" onclick="fmtQuote()" aria-label="Quote">❝</button>
    <button data-f="code" onclick="fmtCode()" aria-label="Code">&lt;/&gt;</button>
    <button data-f="link" onclick="fmtLink()" aria-label="Link">🔗</button>
  </div>
  </div>
</div>

<!-- ── SETTINGS ─────────────────────────────────── -->
<div id="settings-screen" class="screen">
  <div class="set-title">Note</div>
  <p class="set-sub">Syncs with the Notes widget on your desktop.</p>
  <div class="field">
    <label>Notes Code</label>
    <input id="s-code" type="text" placeholder="NOTES_CODE from task-sync.conf"
           autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </div>
  <div class="field">
    <label>Toolbar size</label>
    <div class="seg" id="seg-size">
      <button data-size="small" onclick="setFmtSize('small')">Small</button>
      <button data-size="medium" onclick="setFmtSize('medium')">Medium</button>
      <button data-size="large" onclick="setFmtSize('large')">Large</button>
    </div>
  </div>
  <button class="btn" onclick="saveSettings()">Connect</button>
  <button class="btn ghost" onclick="refreshApp()">Refresh app</button>
  <p class="set-sub" style="margin-top:0">Loads the latest version. Your notes stay on this phone.</p>
  <button class="btn ghost" id="set-back" onclick="showScreen('list-screen')" style="display:none">Back</button>
</div>

<script>
// ── STATE ─────────────────────────────────────────────
// notes: [{ id, text, pinned, updated }]   same shape as the desktop widget's notes.json
// deleted: { id: epoch }                   tombstones, so a delete reaches every device
// synced: { id: updated }                  the version last confirmed on the server
let cfg = {};
let notes = [], folders = [], deleted = {}, synced = {};
let view = localStorage.getItem('nt_view'); if (view === null) view = '*';   // '*' = all notes, '' = no folder, else a folder id
let currentId = null;
let syncing = false, syncAgain = false;

const now = () => Math.floor(Date.now() / 1000);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Same Supabase project as QuickSend; the anon key is a public client key.
const DEFAULT_URL = 'https://baafdbfmcdviwszphuvl.supabase.co';
const DEFAULT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhYWZkYmZtY2R2aXdzenBodXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2Nzg0MDQsImV4cCI6MjA5ODI1NDQwNH0.ph6fyXVeOz9f_NRSEQwq-yGYntpadmHakz2eg_14S-M';
function loadConfig() {
  cfg = { url: DEFAULT_URL, key: DEFAULT_KEY, code: localStorage.getItem('nt_code') || '' };
}
const isConfigured = () => !!(cfg.url && cfg.key && cfg.code);

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('nt_state') || '{}');
    notes = Array.isArray(s.notes) ? s.notes : [];
    folders = Array.isArray(s.folders) ? s.folders : [];
    deleted = s.deleted || {}; synced = s.synced || {};
  } catch { notes = []; folders = []; deleted = {}; synced = {}; }
}
function saveState() {
  localStorage.setItem('nt_state', JSON.stringify({ notes, folders, deleted, synced }));
}

// ── NOTE HELPERS ──────────────────────────────────────
function title(n) {
  const first = String(n.text || '').split('\n').find(l => l.trim());
  return first ? first.trim() : 'Empty note';
}
const plain = l => l.replace(/^(\s*)- \[ \] /, '$1☐ ').replace(/^(\s*)- \[[xX]\] /, '$1☑ ')
  .replace(/^\s*(#{1,6}|>|[-*]|\d+\.)\s+/, '').replace(/(\*\*|~~|`)/g, '').replace(/\*([^*]+)\*/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
const boxes = plain;
function preview(n) {
  const lines = String(n.text || '').split('\n').filter(l => l.trim());
  return lines.slice(1, 3).map(l => boxes(l.trim())).join('\n');
}
function relTime(ts) {
  const d = Math.floor(Date.now() / 1000) - ts;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + ' min ago';
  if (d < 86400) return Math.floor(d / 3600) + ' h ago';
  const dt = new Date(ts * 1000);
  return dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const getNote = id => notes.find(n => n.id === id) || null;
const getFolder = id => folders.find(f => f.id === id) || null;
const folderOf = n => (n && n.folder && getFolder(n.folder)) ? n.folder : '';     // a vanished folder shows as "no folder"
const sortedFolders = () => folders.slice().sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
const notesInView = () => sortedNotes().filter(n => view === '*' || folderOf(n) === view);
function setView(v, quiet) { view = v; localStorage.setItem('nt_view', v); if (!quiet) renderList(); }
function validateView() { if (view !== '*' && !getFolder(view)) setView('*', true); }   // All notes is the only built-in view; unfiled notes live in it
const sortedNotes = () => notes.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);

// ── SCREENS ───────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg, undo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  if (undo) {
    const b = document.createElement('span');
    b.className = 'toast-undo'; b.textContent = 'Undo';

  document.getElementById('sheet').classList.add('show');
}
function closeSheet() { document.getElementById('sheet').classList.remove('show'); }
document.getElementById('sheet-card').addEventListener('click', e => {
  const b = e.target.closest('.sheet-row'); if (!b) return;
  let fid = b.dataset.fid;
  if (b.dataset.new) { fid = newFolder(true); if (fid === null) return; }
  closeSheet();
  if (moveNote(currentId, fid)) showToast(fid ? 'Moved to ' + getFolder(fid).name : 'Removed from folder');
  paintEditorMeta();
});

function removeNote(id, quiet) {
  const cur = getNote(id);
  notes = notes.filter(n => n.id !== id);
  // tombstone so the delete reaches the other devices; strictly newer than the note's last edit, or a delete in the
  // same second as an upload wouldn't sync
  if (id in synced || !quiet) deleted[id] = Math.max(now(), ((cur && cur.updated) || 0) + 1);
  saveState(); scheduleSync();
}

// ── FORMATTING TOOLBAR ON/OFF ─────────────────────────
function setFmtBar(on, quiet) {
  if (on === undefined) on = localStorage.getItem('nt_fmtbar') === '0';   // no argument: flip
  document.getElementById('fmt').style.display = on ? '' : 'none';
  document.getElementById('fmt-toggle').classList.toggle('on', on);
  if (!quiet) localStorage.setItem('nt_fmtbar', on ? '1' : '0');
}
setFmtBar(localStorage.getItem('nt_fmtbar') !== '0', true);

// ── TOOLBAR SIZE ──────────────────────────────────────
const FMT_SIZES = { small: ['40px', '16px'], medium: ['48px', '19px'], large: ['58px', '23px'] };
function setFmtSize(size, quiet) {
  if (!FMT_SIZES[size]) size = 'medium';
  const root = document.documentElement.style;
  root.setProperty('--fb', FMT_SIZES[size][0]); root.setProperty('--ff', FMT_SIZES[size][1]);
  document.querySelectorAll('#seg-size button').forEach(b => b.classList.toggle('on', b.dataset.size === size));
  if (!quiet) localStorage.setItem('nt_fmt', size);
}
setFmtSize(localStorage.getItem('nt_fmt') || 'medium', true);

// ── SETTINGS ──────────────────────────────────────────
function openSettings() {
  document.getElementById('s-code').value = cfg.code;
  document.getElementById('set-back').style.display = isConfigured() ? '' : 'none';
  showScreen('settings-screen');
}
function saveSettings() {
  const code = document.getElementById('s-code').value.trim();
  if (!code) { showToast('Enter your notes code'); return; }
  const changed = code !== cfg.code;
  localStorage.setItem('nt_code', code);
  if (changed) { localStorage.removeItem('nt_since'); synced = {}; saveState(); }
  loadConfig();
  showScreen('list-screen'); renderList(); syncNow(true);
}

// ── SYNC ──────────────────────────────────────────────
// Pull what changed on the server, merge (newest edit wins, a newer delete beats an older
// edit), then push what only exists here.
function hdrs() {
  return { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'Content-Type': 'application/json' };
}
let syncTimer = null;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 800); }

// A server row's folder: null/undefined = written by a client that doesn't know folders (keep ours); '' = no folder.
function mergeRemote(rows) {
  let changed = false;
  for (const r of rows) {
    synced[r.id] = Math.max(synced[r.id] || 0, r.updated);
    if (r.deleted) {
      if (!(r.id in deleted) || r.updated > deleted[r.id]) { deleted[r.id] = r.updated; changed = true; }
      const mine = getNote(r.id);
      if (mine && mine.updated <= r.updated) { notes = notes.filter(n => n.id !== r.id); changed = true; }
    } else {
      if (r.id in deleted && deleted[r.id] >= r.updated) continue;
      const mine = getNote(r.id);
      if (!mine) {
        const n = { id: r.id, text: r.text, pinned: r.pinned, updated: r.updated };
        if (r.folder != null) n.folder = r.folder;
        notes.push(n); changed = true;
      } else if (r.updated > mine.updated) {
        mine.text = r.text; mine.pinned = r.pinned; mine.updated = r.updated;
        if (r.folder != null) mine.folder = r.folder;
        changed = true;
      }
    }
  }
  return changed;
}
function mergeRemoteFolders(rows) {
  let changed = false;
  for (const r of rows) {
    synced[r.id] = Math.max(synced[r.id] || 0, r.updated);
    if (r.deleted) {
      if (!(r.id in deleted) || r.updated > deleted[r.id]) { deleted[r.id] = r.updated; changed = true; }
      const mine = getFolder(r.id);
      if (mine && mine.updated <= r.updated) { folders = folders.filter(f => f.id !== r.id); changed = true; }
    } else {
      if (r.id in deleted && deleted[r.id] >= r.updated) continue;
      const mine = getFolder(r.id);
      if (!mine) { folders.push({ id: r.id, name: r.name, updated: r.updated }); changed = true; }
      else if (r.updated > mine.updated) { mine.name = r.name; mine.updated = r.updated; changed = true; }
    }
  }
  return changed;
}

// Folders need the 002_folders.sql migration. Until it has been run the server answers 4xx for them: carry on with
// plain notes, keep folders on this phone, and try the folder parts again every few minutes.
const folderSync = { ok: true, retryAt: 0 };
const noFolders = () => { folderSync.ok = false; folderSync.retryAt = Date.now() + 5 * 60 * 1000; };
const is4xx = r => r.status >= 400 && r.status < 500;

async function syncNow(manual) {
  if (!isConfigured()) { if (manual) showToast('Set a notes code first'); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; setDot('busy');
  try {
    // pull notes (with their folder, unless the server has no folder column yet)
    if (!folderSync.ok && Date.now() >= folderSync.retryAt) folderSync.ok = true;
    const code = encodeURIComponent(cfg.code);
    const since = Number(localStorage.getItem('nt_since') || 0);
    const notesUrl = cols => `${cfg.url}/rest/v1/quick_notes?note_code=eq.${code}&updated=gt.${since}&select=${cols}&order=updated.asc`;
    let res = await fetch(notesUrl('id,text,pinned,updated,deleted' + (folderSync.ok ? ',folder' : '')), { headers: hdrs() });
    if (!res.ok && is4xx(res) && folderSync.ok) { noFolders(); res = await fetch(notesUrl('id,text,pinned,updated,deleted'), { headers: hdrs() }); }
    if (!res.ok) throw new Error('pull ' + res.status);
    const rows = await res.json();
    let frows = [];
    if (folderSync.ok) {
      const sinceF = Number(localStorage.getItem('nt_since_f') || 0);
      const fr = await fetch(`${cfg.url}/rest/v1/quick_folders?note_code=eq.${code}&updated=gt.${sinceF}&select=id,name,updated,deleted&order=updated.asc`, { headers: hdrs() });
      if (fr.ok) frows = await fr.json();
      else if (is4xx(fr)) noFolders();
      else throw new Error('pull folders ' + fr.status);
      if (frows.length) localStorage.setItem('nt_since_f', String(Math.max(0, frows[frows.length - 1].updated - 120)));
    }
    if (rows.length) localStorage.setItem('nt_since', String(Math.max(0, rows[rows.length - 1].updated - 120)));   // overlap so a skewed clock can't hide an edit
    const changed = mergeRemote(rows) | mergeRemoteFolders(frows);
    if (changed) {
      saveState(); renderList();
      const n = getNote(currentId);
      if (n && n.text !== getText() && norm(n.text) !== getText() && Date.now() - lastInput > 3000) { setText(n.text); paintEditorMeta(); }
      if (currentId && !getNote(currentId)) { currentId = null; showScreen('list-screen'); }
    }
    // push (folder tombstones go to the folders table, never the notes table)
    const out = [], fout = [];
    for (const n of notes) if (n.text.trim() && n.updated > (synced[n.id] || 0)) out.push({ id: n.id, text: n.text, pinned: !!n.pinned, updated: n.updated, deleted: false, folder: n.folder || '' });
    for (const f of folders) if (f.updated > (synced[f.id] || 0)) fout.push({ id: f.id, name: f.name, updated: f.updated, deleted: false });
    for (const id in deleted) if (deleted[id] > (synced[id] || 0)) {
      if (id.startsWith('f-')) fout.push({ id, name: '', updated: deleted[id], deleted: true });
      else out.push({ id, text: '', pinned: false, updated: deleted[id], deleted: true, folder: '' });
    }
    if (out.length) {
      const p = await fetch(`${cfg.url}/rest/v1/rpc/upsert_quick_notes`, {
        method: 'POST', headers: hdrs(), body: JSON.stringify({ p_code: cfg.code, p_notes: out }),
      });
      if (!p.ok) throw new Error('push ' + p.status);
      for (const o of out) synced[o.id] = Math.max(synced[o.id] || 0, o.updated);
    }
    if (fout.length && folderSync.ok) {
      const p = await fetch(`${cfg.url}/rest/v1/rpc/upsert_quick_folders`, {
        method: 'POST', headers: hdrs(), body: JSON.stringify({ p_code: cfg.code, p_folders: fout }),
      });
      if (p.ok) for (const o of fout) synced[o.id] = Math.max(synced[o.id] || 0, o.updated);
      else if (is4xx(p)) noFolders();
      else throw new Error('push folders ' + p.status);
    }
    saveState();
    setDot('ok');
    if (manual) showToast('Synced');
  } catch (e) {
    setDot('err');
    if (manual) showToast('Sync failed');
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}

// Drop the offline cache and service worker, then reload so the newest version is fetched.
// Notes live in localStorage, which this leaves alone.
async function refreshApp() {
  showToast('Refreshing…');
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) {}
  location.reload();
}

// ── START ─────────────────────────────────────────────
loadConfig(); loadState();
renderList();
if (isConfigured()) { showScreen('list-screen'); syncNow(false); }
else openSettings();
setInterval(() => { if (document.visibilityState === 'visible' && isConfigured()) syncNow(false); }, 8000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });
window.addEventListener('online', () => syncNow(false));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
