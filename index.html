<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Note</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Note">
  <meta name="theme-color" content="#111213">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #14120f;
      --surface: #1d1a16;
      --surface2: #27231d;
      --border: #332e26;
      --text: #f0ebe3;
      --dim: #9a9285;
      --accent: #f2b84b;
      --accent-ink: #1a1408;
      --error: #f2685b;
      --r: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; }
    button { font: inherit; color: inherit; }

    .screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
    .screen.active { display: flex; }

    /* ── LIST ─────────────────────────────────── */
    .top { padding: calc(14px + env(safe-area-inset-top)) 18px 6px; }
    .top-row { display: flex; align-items: center; justify-content: space-between; }
    .big-title { font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif;
      font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
    .top-actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: none; border: none; color: var(--dim); width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; }
    .icon-btn:active { background: var(--surface2); }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
    .dot.ok { background: #6cc070; } .dot.busy { background: var(--accent); } .dot.err { background: var(--error); }
    .search { margin-top: 10px; width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 16px; padding: 11px 14px; outline: none; -webkit-appearance: none; }
    .search:focus { border-color: var(--accent); }
    .search::placeholder { color: var(--dim); }

    #list { flex: 1; overflow-y: auto; padding: 8px 18px calc(110px + env(safe-area-inset-bottom)); }
    .section { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim); margin: 16px 2px 8px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
    .card:active { background: var(--surface2); }
    .card.pinned { border-left: 3px solid var(--accent); }
    .card-title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-prev { color: var(--dim); font-size: 14px; line-height: 1.4; margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
    .card-time { color: var(--dim); font-size: 12px; margin-top: 8px; opacity: .8; }
    .empty { text-align: center; color: var(--dim); margin-top: 90px; line-height: 1.6; }
    .empty b { display: block; font-size: 18px; color: var(--text); margin-bottom: 4px; }

    #fab { position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom));
      width: 60px; height: 60px; border-radius: 20px; border: none; background: var(--accent); color: var(--accent-ink);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,.45); cursor: pointer; }
    #fab:active { transform: scale(.94); }
    #fab svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

    /* ── EDITOR ───────────────────────────────── */
    #editor-screen { background: var(--bg); }
    .ed-bar { display: flex; align-items: center; justify-content: space-between;
      padding: calc(8px + env(safe-area-inset-top)) 10px 8px; border-bottom: 1px solid var(--border); }
    .back { display: flex; align-items: center; gap: 2px; background: none; border: none; color: var(--accent);
      font-size: 17px; font-weight: 600; padding: 8px 8px; cursor: pointer; }
    .back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .ed-actions { display: flex; }
    .icon-btn.on { color: var(--accent); }
    .icon-btn.danger { color: var(--error); }
    #ed-text { flex: 1; width: 100%; background: none; border: none; outline: none; resize: none; color: var(--text);
      font-size: 17px; line-height: 1.55; padding: 16px 18px calc(24px + env(safe-area-inset-bottom)); }
    .fmt { display: flex; gap: 2px; overflow-x: auto; padding: 4px 8px; border-top: 1px solid var(--border);
      scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .fmt::-webkit-scrollbar { display: none; }
    .fmt button { flex: none; min-width: 42px; height: 40px; padding: 0 8px; background: none; border: none; border-radius: 10px;
      color: var(--dim); font-size: 16px; font-weight: 700; cursor: pointer; }
    .fmt button:active { background: var(--surface2); color: var(--text); }
    .fmt .sep { flex: none; width: 1px; margin: 8px 4px; background: var(--border); }
    #ed-view { flex: 1; display: none; overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom)); line-height: 1.55; font-size: 17px; word-wrap: break-word; }
    #ed-view h1, #ed-view h2, #ed-view h3 { line-height: 1.25; margin: 14px 0 6px; font-family: ui-rounded, -apple-system, sans-serif; }
    #ed-view h1 { font-size: 26px; } #ed-view h2 { font-size: 21px; } #ed-view h3 { font-size: 18px; }
    #ed-view p { margin: 8px 0; } #ed-view ul, #ed-view ol { margin: 8px 0; padding-left: 24px; }
    #ed-view ul.chk { list-style: none; padding-left: 0; } #ed-view li.chk { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0; }
    #ed-view li.chk input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
    #ed-view li.done span { color: var(--dim); text-decoration: line-through; }
    #ed-view blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--dim); margin: 8px 0; }
    #ed-view code { background: var(--surface2); border-radius: 6px; padding: 1px 5px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
    #ed-view pre { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    #ed-view pre code { background: none; padding: 0; }
    #ed-view a { color: var(--accent); } #ed-view hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .ed-tools { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-top: 1px solid var(--border); }
    .toast-undo { color: var(--accent); font-weight: 700; margin-left: 12px; cursor: pointer; pointer-events: auto; }
    .ed-meta { padding: 6px 18px; font-size: 12px; color: var(--dim); }

    /* ── SETTINGS ─────────────────────────────── */
    #settings-screen { padding: calc(28px + env(safe-area-inset-top)) 20px 40px; overflow-y: auto; gap: 18px; }
    .set-title { font-family: ui-rounded, -apple-system, sans-serif; font-size: 28px; font-weight: 800; }
    .set-sub { color: var(--dim); font-size: 14px; margin-top: -10px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .field input { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
      font-size: 16px; padding: 12px 14px; outline: none; width: 100%; -webkit-appearance: none; }
    .field input:focus { border-color: var(--accent); }
    .btn { background: var(--accent); border: none; border-radius: 14px; color: var(--accent-ink);
      font-size: 16px; font-weight: 700; padding: 14px; cursor: pointer; width: 100%; }
    .btn.ghost { background: var(--surface2); color: var(--text); }
    .btn:active { opacity: .75; }
    details.adv { border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; }
    details.adv summary { padding: 12px 0; font-size: 13px; color: var(--dim); cursor: pointer; }
    details.adv .field { padding-bottom: 14px; }

    #toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 18px;
      border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50; }
    #toast.show { pointer-events: auto; opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="toast"></div>

<!-- ── LIST ─────────────────────────────────────── -->
<div id="list-screen" class="screen">
  <div class="top">
    <div class="top-row">
      <div class="big-title">Notes</div>
      <div class="top-actions">
        <button class="icon-btn" onclick="syncNow(true)" title="Sync" aria-label="Sync" style="width:auto;padding:0 8px;border-radius:20px">
          <span class="dot" id="dot"></span>
        </button>
        <button class="icon-btn" onclick="openSettings()" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <input class="search" id="search" type="search" placeholder="Search notes" autocomplete="off" oninput="renderList()">
  </div>
  <div id="list"></div>
  <button id="fab" onclick="newNote()" aria-label="New note"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<!-- ── EDITOR ───────────────────────────────────── -->
<div id="editor-screen" class="screen">
  <div class="ed-bar">
    <button class="back" onclick="closeEditor()">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Notes
    </button>
    <div class="ed-actions">
      <button class="icon-btn" id="view-btn" onclick="toggleView()" title="Preview" aria-label="Preview">
        <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn" id="pin-btn" onclick="togglePin()" title="Pin" aria-label="Pin">
        <svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 3 3v2H7v-2l3-3z"/></svg>
      </button>
      <button class="icon-btn danger" onclick="deleteCurrent()" title="Delete" aria-label="Delete">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>
      </button>
    </div>
  </div>
  <textarea id="ed-text" placeholder="Start typing…" oninput="onEdit()" onblur="flushEdit()" onkeydown="onKey(event)"></textarea>
  <div id="ed-view"></div>
  <div class="fmt" id="fmt" onmousedown="event.preventDefault()" ontouchstart="">
    <button onclick="fmtWrap('**','**','bold')" aria-label="Bold"><b>B</b></button>
    <button onclick="fmtWrap('*','*','italic')" aria-label="Italic"><i style="font-family:serif">I</i></button>
    <button onclick="fmtWrap('~~','~~','strike')" aria-label="Strikethrough"><s>S</s></button>
    <span class="sep"></span>
    <button onclick="fmtHeading()" aria-label="Heading">H</button>
    <button onclick="fmtLines('- ')" aria-label="Bullet list">•</button>
    <button onclick="fmtLines('1. ')" aria-label="Numbered list">1.</button>
    <button onclick="cycleCheck()" aria-label="Checklist">☑</button>
    <span class="sep"></span>
    <button onclick="fmtLines('> ')" aria-label="Quote">❝</button>
    <button onclick="fmtWrap('`','`','code')" aria-label="Code">&lt;/&gt;</button>
    <button onclick="fmtLink()" aria-label="Link">🔗</button>
  </div>
  <div class="ed-tools"><div class="ed-meta" id="ed-meta" style="flex:1;text-align:right"></div></div>
  </div>
</div>

<!-- ── SETTINGS ─────────────────────────────────── -->
<div id="settings-screen" class="screen">
  <div class="set-title">Note</div>
  <p class="set-sub">Syncs with the Notes widget on your desktop.</p>
  <div class="field">
    <label>Notes Code</label>
    <input id="s-code" type="text" placeholder="NOTES_CODE from task-sync.conf"
           autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </div>
  <button class="btn" onclick="saveSettings()">Connect</button>
  <button class="btn ghost" onclick="refreshApp()">Refresh app</button>
  <p class="set-sub" style="margin-top:0">Loads the latest version. Your notes stay on this phone.</p>
  <button class="btn ghost" id="set-back" onclick="showScreen('list-screen')" style="display:none">Back</button>
</div>

<script>
// ── STATE ─────────────────────────────────────────────
// notes: [{ id, text, pinned, updated }]   same shape as the desktop widget's notes.json
// deleted: { id: epoch }                   tombstones, so a delete reaches every device
// synced: { id: updated }                  the version last confirmed on the server
let cfg = {};
let notes = [], deleted = {}, synced = {};
let currentId = null;
let syncing = false, syncAgain = false;

const now = () => Math.floor(Date.now() / 1000);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Same Supabase project as QuickSend; the anon key is a public client key.
const DEFAULT_URL = 'https://baafdbfmcdviwszphuvl.supabase.co';
const DEFAULT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhYWZkYmZtY2R2aXdzenBodXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2Nzg0MDQsImV4cCI6MjA5ODI1NDQwNH0.ph6fyXVeOz9f_NRSEQwq-yGYntpadmHakz2eg_14S-M';
function loadConfig() {
  cfg = { url: DEFAULT_URL, key: DEFAULT_KEY, code: localStorage.getItem('nt_code') || '' };
}
const isConfigured = () => !!(cfg.url && cfg.key && cfg.code);

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('nt_state') || '{}');
    notes = Array.isArray(s.notes) ? s.notes : [];
    deleted = s.deleted || {}; synced = s.synced || {};
  } catch { notes = []; deleted = {}; synced = {}; }
}
function saveState() {
  localStorage.setItem('nt_state', JSON.stringify({ notes, deleted, synced }));
}

// ── NOTE HELPERS ──────────────────────────────────────
function title(n) {
  const first = String(n.text || '').split('\n').find(l => l.trim());
  return first ? first.trim() : 'Empty note';
}
const plain = l => l.replace(/^(\s*)- \[ \] /, '$1☐ ').replace(/^(\s*)- \[[xX]\] /, '$1☑ ')
  .replace(/^\s*(#{1,6}|>|[-*]|\d+\.)\s+/, '').replace(/(\*\*|~~|`)/g, '').replace(/\*([^*]+)\*/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
const boxes = plain;
function preview(n) {
  const lines = String(n.text || '').split('\n').filter(l => l.trim());
  return lines.slice(1, 3).map(l => boxes(l.trim())).join('\n');
}
function relTime(ts) {
  const d = Math.floor(Date.now() / 1000) - ts;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + ' min ago';
  if (d < 86400) return Math.floor(d / 3600) + ' h ago';
  const dt = new Date(ts * 1000);
  return dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const getNote = id => notes.find(n => n.id === id) || null;
const sortedNotes = () => notes.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);

// ── SCREENS ───────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg, undo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  if (undo) {
    const b = document.createElement('span');
    b.className = 'toast-undo'; b.textContent = 'Undo';
    b.onclick = () => { undo(); t.classList.remove('show'); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 1800);
}
function setDot(state) { document.getElementById('dot').className = 'dot ' + state; }

// ── LIST ──────────────────────────────────────────────
function renderList() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = sortedNotes();
  if (q) list = list.filter(n => (n.text || '').toLowerCase().includes(q));
  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = q
      ? `<div class="empty"><b>No matches</b>Nothing contains “${esc(q)}”.</div>`
      : `<div class="empty"><b>No notes yet</b>Tap + to write one.</div>`;
    return;
  }
  const card = n => `<div class="card${n.pinned ? ' pinned' : ''}" data-id="${esc(n.id)}">
      <div class="card-title">${esc(boxes(title(n)))}</div>
      ${preview(n) ? `<div class="card-prev">${esc(preview(n))}</div>` : ''}
      <div class="card-time">${esc(relTime(n.updated))}</div>
    </div>`;
  const pinned = list.filter(n => n.pinned), rest = list.filter(n => !n.pinned);
  el.innerHTML =
    (pinned.length ? `<div class="section">Pinned</div>` + pinned.map(card).join('') : '') +
    (rest.length ? (pinned.length ? `<div class="section">Notes</div>` : '') + rest.map(card).join('') : '');
}
document.getElementById('list').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openEditor(c.dataset.id);
});

// ── EDITOR ────────────────────────────────────────────
let editTimer = null, lastInput = 0;

function newNote() {
  const n = { id: 'n-' + Date.now() + '-' + Math.floor(Math.random() * 1e6), text: '', pinned: false, updated: now() };
  notes.unshift(n);
  openEditor(n.id, true);
}
function openEditor(id, focus) {
  const n = getNote(id); if (!n) return;
  currentId = id; if (previewing) toggleView(false);
  const ta = document.getElementById('ed-text');
  ta.value = n.text;
  showScreen('editor-screen');
  paintEditorMeta();
  if (focus || !n.text) ta.focus();
}
function paintEditorMeta() {
  const n = getNote(currentId); if (!n) return;
  document.getElementById('pin-btn').classList.toggle('on', !!n.pinned);
  document.getElementById('ed-meta').textContent = 'Edited ' + relTime(n.updated);
}
function onEdit() {
  lastInput = Date.now();
  clearTimeout(editTimer);
  editTimer = setTimeout(flushEdit, 500);
}
function flushEdit() {
  clearTimeout(editTimer);
  const n = getNote(currentId); if (!n) return;
  const text = document.getElementById('ed-text').value;
  if (text === n.text) return;
  n.text = text; n.updated = now();
  saveState(); paintEditorMeta(); scheduleSync();
}
// Checklist lines are plain text ("- [ ] item"), so they read fine in the desktop widget too.
function cycleCheck() {
  const ta = document.getElementById('ed-text');
  const pos = ta.selectionStart;
  const start = ta.value.lastIndexOf('\n', pos - 1) + 1;
  let end = ta.value.indexOf('\n', pos); if (end < 0) end = ta.value.length;
  const line = ta.value.slice(start, end);
  const next = /^- \[ \] /.test(line) ? line.replace(/^- \[ \] /, '- [x] ')
    : /^- \[[xX]\] /.test(line) ? line.replace(/^- \[[xX]\] /, '')
    : '- [ ] ' + line;
  ta.value = ta.value.slice(0, start) + next + ta.value.slice(end);
  const c = start + next.length;
  ta.setSelectionRange(c, c); ta.focus();
  onEdit();
}
function onKey(e) {
  if (e.key !== 'Enter' || e.shiftKey) return;
  const ta = e.target, pos = ta.selectionStart;
  if (pos !== ta.selectionEnd) return;
  const start = ta.value.lastIndexOf('\n', pos - 1) + 1;
  const line = ta.value.slice(start, pos);
  const m = line.match(/^(- \[[ xX]\] |- |\* |> |(\d+)\. )(.*)$/);
  if (!m) return;
  e.preventDefault();
  if (!m[3].trim()) {   // Enter on an empty item ends the list
    ta.setRangeText('', start, pos, 'end');
  } else {
    const next = m[2] ? (+m[2] + 1) + '. ' : m[1].startsWith('- [') ? '- [ ] ' : m[1];
    ta.setRangeText('\n' + next, pos, pos, 'end');
  }
  onEdit();
}

// ── FORMATTING TOOLBAR ────────────────────────────────
const edTa = () => document.getElementById('ed-text');
function fmtWrap(pre, post, ph) {
  const ta = edTa(); let a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  if (v.slice(a - pre.length, a) === pre && v.slice(b, b + post.length) === post) {   // already wrapped: unwrap
    ta.setRangeText(v.slice(a, b), a - pre.length, b + post.length, 'select');
  } else if (a === b) {
    ta.setRangeText(pre + ph + post, a, b, 'end');
    ta.setSelectionRange(a + pre.length, a + pre.length + ph.length);
  } else {
    ta.setRangeText(pre + v.slice(a, b) + post, a, b, 'end');
  }
  ta.focus(); onEdit();
}
function selLines() {
  const ta = edTa(), v = ta.value;
  const a = v.lastIndexOf('\n', ta.selectionStart - 1) + 1;
  let b = v.indexOf('\n', ta.selectionEnd); if (b < 0) b = v.length;
  return [a, b];
}
function fmtLines(prefix) {
  const ta = edTa(), [a, b] = selLines();
  const lines = ta.value.slice(a, b).split('\n');
  const re = prefix === '1. ' ? /^\d+\. / : new RegExp('^' + prefix.replace(/[-*]/g, '\\$&'));
  const all = lines.every(l => re.test(l) || !l.trim());
  let n = 0;
  const out = lines.map(l => {
    if (!l.trim()) return l;
    const bare = l.replace(/^(- \[[ xX]\] |- |\* |> |\d+\. |#{1,6} )/, '');
    if (all) return l.replace(re, '');
    return (prefix === '1. ' ? (++n) + '. ' : prefix) + bare;
  }).join('\n');
  ta.setRangeText(out, a, b, 'end'); ta.focus(); onEdit();
}
function fmtHeading() {   // none → # → ## → ### → none
  const ta = edTa(), [a, b] = selLines();
  const line = ta.value.slice(a, b);
  const m = line.match(/^(#{1,3}) /);
  const next = !m ? '# ' : m[1].length < 3 ? '#'.repeat(m[1].length + 1) + ' ' : '';
  ta.setRangeText(next + line.replace(/^#{1,6} /, ''), a, b, 'end'); ta.focus(); onEdit();
}
function fmtLink() {
  const ta = edTa(), a = ta.selectionStart, b = ta.selectionEnd;
  const text = ta.value.slice(a, b) || 'text';
  ta.setRangeText('[' + text + '](url)', a, b, 'end');
  const u = a + text.length + 3;
  ta.setSelectionRange(u, u + 3); ta.focus(); onEdit();
}

// ── PREVIEW (small markdown renderer; input is escaped first) ──
function inline(t) {
  t = esc(t);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/~~([^~]+)~~/g, '<s>$1</s>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
       .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
}
function renderMd(text) {
  const lines = String(text || '').split('\n'), out = [];
  let list = null, para = [], fence = null;
  const endPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const endList = () => { if (list) { out.push('</' + list.split(' ')[0] + '>'); list = null; } };
  lines.forEach((l, i) => {
    if (fence) { if (/^```/.test(l)) { out.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>'); fence = null; } else fence.push(l); return; }
    let m;
    if (/^```/.test(l)) { endPara(); endList(); fence = []; return; }
    if ((m = l.match(/^(- |\* )\[([ xX])\] (.*)$/))) {
      endPara(); if (list !== 'ul class="chk"') { endList(); out.push('<ul class="chk">'); list = 'ul class="chk"'; }
      const done = m[2] !== ' ';
      out.push(`<li class="chk${done ? ' done' : ''}"><input type="checkbox" data-line="${i}"${done ? ' checked' : ''}><span>${inline(m[3])}</span></li>`); return;
    }
    if ((m = l.match(/^[-*] (.*)$/))) { endPara(); if (list !== 'ul') { endList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    if ((m = l.match(/^\d+\. (.*)$/))) { endPara(); if (list !== 'ol') { endList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    endList();
    if ((m = l.match(/^(#{1,3}) (.*)$/))) { endPara(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); return; }
    if ((m = l.match(/^> ?(.*)$/))) { endPara(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); return; }
    if (/^(---|\*\*\*)\s*$/.test(l)) { endPara(); out.push('<hr>'); return; }
    if (!l.trim()) { endPara(); return; }
    para.push(l);
  });
  if (fence) out.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>');
  endPara(); endList();
  return out.join('');
}
let previewing = false;
function toggleView(force) {
  previewing = force === undefined ? !previewing : force;
  flushEdit();
  const ta = edTa(), v = document.getElementById('ed-view');
  if (previewing) { v.innerHTML = renderMd(ta.value) || '<p style="color:var(--dim)">Nothing here yet.</p>'; }
  ta.style.display = previewing ? 'none' : ''; v.style.display = previewing ? 'block' : 'none';
  document.getElementById('fmt').style.display = previewing ? 'none' : '';
  document.getElementById('view-btn').classList.toggle('on', previewing);
}
document.getElementById('ed-view').addEventListener('change', e => {   // tap a checkbox in the preview
  const cb = e.target.closest('input[data-line]'); if (!cb) return;
  const ta = edTa(), lines = ta.value.split('\n'), i = +cb.dataset.line;
  lines[i] = lines[i].replace(/\[[ xX]\]/, cb.checked ? '[x]' : '[ ]');
  ta.value = lines.join('\n'); flushEdit();
  cb.closest('li').classList.toggle('done', cb.checked);
});
function closeEditor() {
  flushEdit(); if (previewing) toggleView(false);
  const n = getNote(currentId);
  // A note left empty is dropped (and deleted on the server only if it ever got there).
  if (n && !n.text.trim()) removeNote(n.id, true);
  currentId = null;
  renderList();
  showScreen('list-screen');
}
function togglePin() {
  flushEdit();
  const n = getNote(currentId); if (!n) return;
  n.pinned = !n.pinned; n.updated = now();
  saveState(); paintEditorMeta(); scheduleSync();
}
function deleteCurrent() {
  flushEdit();
  const n = getNote(currentId); if (!n) return;
  const copy = Object.assign({}, n);
  removeNote(currentId);
  currentId = null;
  renderList(); showScreen('list-screen');
  showToast('Deleted', () => {   // undo: a fresh `updated` beats the tombstone everywhere
    copy.updated = Math.max(now(), (deleted[copy.id] || 0) + 1);
    notes.push(copy); delete deleted[copy.id];
    saveState(); renderList(); scheduleSync();
  });
}
function removeNote(id, quiet) {
  notes = notes.filter(n => n.id !== id);
  if (id in synced || !quiet) deleted[id] = now();   // tombstone so the delete reaches the other devices
  saveState(); scheduleSync();
}

// ── SETTINGS ──────────────────────────────────────────
function openSettings() {
  document.getElementById('s-code').value = cfg.code;
  document.getElementById('set-back').style.display = isConfigured() ? '' : 'none';
  showScreen('settings-screen');
}
function saveSettings() {
  const code = document.getElementById('s-code').value.trim();
  if (!code) { showToast('Enter your notes code'); return; }
  const changed = code !== cfg.code;
  localStorage.setItem('nt_code', code);
  if (changed) { localStorage.removeItem('nt_since'); synced = {}; saveState(); }
  loadConfig();
  showScreen('list-screen'); renderList(); syncNow(true);
}

// ── SYNC ──────────────────────────────────────────────
// Pull what changed on the server, merge (newest edit wins, a newer delete beats an older
// edit), then push what only exists here.
function hdrs() {
  return { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'Content-Type': 'application/json' };
}
let syncTimer = null;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 800); }

function mergeRemote(rows) {
  let changed = false;
  for (const r of rows) {
    synced[r.id] = Math.max(synced[r.id] || 0, r.updated);
    if (r.deleted) {
      if (!(r.id in deleted) || r.updated > deleted[r.id]) { deleted[r.id] = r.updated; changed = true; }
      const mine = getNote(r.id);
      if (mine && mine.updated <= r.updated) { notes = notes.filter(n => n.id !== r.id); changed = true; }
    } else {
      if (r.id in deleted && deleted[r.id] >= r.updated) continue;
      const mine = getNote(r.id);
      if (!mine) { notes.push({ id: r.id, text: r.text, pinned: r.pinned, updated: r.updated }); changed = true; }
      else if (r.updated > mine.updated) { mine.text = r.text; mine.pinned = r.pinned; mine.updated = r.updated; changed = true; }
    }
  }
  return changed;
}

async function syncNow(manual) {
  if (!isConfigured()) { if (manual) showToast('Set a notes code first'); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; setDot('busy');
  try {
    // pull
    const since = Number(localStorage.getItem('nt_since') || 0);
    const res = await fetch(`${cfg.url}/rest/v1/quick_notes?note_code=eq.${encodeURIComponent(cfg.code)}` +
      `&updated=gt.${since}&select=id,text,pinned,updated,deleted&order=updated.asc`, { headers: hdrs() });
    if (!res.ok) throw new Error('pull ' + res.status);
    const rows = await res.json();
    if (rows.length) {
      const changed = mergeRemote(rows);
      // overlap a little so a skewed clock can't hide an edit
      localStorage.setItem('nt_since', String(Math.max(0, rows[rows.length - 1].updated - 120)));
      if (changed) {
        saveState(); renderList();
        const n = getNote(currentId);
        const ta = document.getElementById('ed-text');
        if (n && n.text !== ta.value && Date.now() - lastInput > 3000) { ta.value = n.text; paintEditorMeta(); }
        if (currentId && !getNote(currentId)) { currentId = null; showScreen('list-screen'); }
      }
    }
    // push
    const out = [];
    for (const n of notes) if (n.text.trim() && n.updated > (synced[n.id] || 0)) out.push({ id: n.id, text: n.text, pinned: !!n.pinned, updated: n.updated, deleted: false });
    for (const id in deleted) if (deleted[id] > (synced[id] || 0)) out.push({ id, text: '', pinned: false, updated: deleted[id], deleted: true });
    if (out.length) {
      const p = await fetch(`${cfg.url}/rest/v1/rpc/upsert_quick_notes`, {
        method: 'POST', headers: hdrs(), body: JSON.stringify({ p_code: cfg.code, p_notes: out }),
      });
      if (!p.ok) throw new Error('push ' + p.status);
      for (const o of out) synced[o.id] = Math.max(synced[o.id] || 0, o.updated);
      saveState();
    }
    setDot('ok');
    if (manual) showToast('Synced');
  } catch (e) {
    setDot('err');
    if (manual) showToast('Sync failed');
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}

// Drop the offline cache and service worker, then reload so the newest version is fetched.
// Notes live in localStorage, which this leaves alone.
async function refreshApp() {
  showToast('Refreshing…');
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) {}
  location.reload();
}

// ── START ─────────────────────────────────────────────
loadConfig(); loadState();
renderList();
if (isConfigured()) { showScreen('list-screen'); syncNow(false); }
else openSettings();
setInterval(() => { if (document.visibilityState === 'visible' && isConfigured()) syncNow(false); }, 8000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });
window.addEventListener('online', () => syncNow(false));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
